version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: p4_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sistema_autenticacion
      MYSQL_USER: p4_user
      MYSQL_PASSWORD: p4_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./doc/database.sql:/docker-entrypoint-initdb.d/database.sql
    networks:
      - p4_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: p4_backend_nestjs
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_USER: p4_user
      DB_PASSWORD: p4_password
      DB_NAME: sistema_autenticacion
      JWT_ACCESS_SECRET: supersecret_access_key_p4_2026
      JWT_REFRESH_SECRET: supersecret_refresh_key_p4_2026
      JWT_ACCESS_EXPIRATION: 900s
      JWT_REFRESH_EXPIRATION: 7d
    depends_on:
      - mysql_db
    networks:
      - p4_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: p4_frontend_react
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - p4_network

volumes:
  mysql_data:

networks:
  p4_network:
    driver: bridge
